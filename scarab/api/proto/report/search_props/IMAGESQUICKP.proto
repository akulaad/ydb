}

// TODO protobufize https://a.yandex-team.ru/arc/trunk/arcadia/search/web/rearrange/imgqueryurlban/imgqueryurlban.cpp
message TPropImgQueryUrlBan {
    option (NYT.default_field_flags) = SERIALIZATION_YT;

    optional uint64 BanListLength = 1;
