    optional string QueryUrlBanned = 3;
    optional string QueryUsedForBan = 4;
    optional uint64 TrieAllDocs = 5;
    optional uint64 TrieAllQueries = 6;
    optional string TrieIndexState = 7;
    optional string TrieTimestamp = 8;
    optional uint64 TrieUniqueDocs = 9;
