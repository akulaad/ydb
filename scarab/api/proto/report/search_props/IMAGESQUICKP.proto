    optional string RankingMn = 22;
    optional string RankingModel = 23;
    optional bool RankingTopHandJobBoosts = 24;
    optional string RankingWords = 25;
    map<string, string> RemovedDoc = 26 [(_compat_renamed_prefix) = "RemovedDoc_"];
    optional string RequestedRankingModel = 27;
    map<string, string> SnippetUnanswer = 28 [(_compat_renamed_prefix) = "SnippetUnanswer_"];
    optional uint64 SourceTimestamp = 29;
    optional double SuperMindMult = 30;
    map<string, string> Unanswer = 31 [(_compat_renamed_prefix) = "Unanswer_"];
    optional string ImagesModelsInputs = 32 [(_compat_renamed_from) = "ImagesModelsQueryInputs", (_owner_fld) = "abc:images", (_infinite_ttl) = true, (_split_size_limit) = 0];
}

// Source definition
message TSource {
    option (NYT.default_field_flags) = SERIALIZATION_YT;

    optional TPropImgGruesome ImgGruesome = 1;
    optional TPropImgPorno ImgPorno = 2;
    optional TPropImgQueryFactors ImgQueryFactors = 3;
    optional TPropImgQueryUrlBan ImgQueryUrlBan = 4;
    optional TPropImgSemidupsGlueing ImgSemidupsGlueing = 5;
    optional TPropRoot Root = 6 [(_compat_renamed_from) = ""];

    optional NScarabProto.NReport.NSearchProps.NCommon.TPropConfigurableRearrangeApplier ImgConfigurableRearrangeApplier = 7 [
        (_owner_fld) = "abc:relev_tools",
        (_split_size_limit) = 470
    ];
} // bext: 8
