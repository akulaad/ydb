// Props definitions

// TODO protobufize https://a.yandex-team.ru/arc/trunk/arcadia/search/web/rearrange/imgruesome/imgruesome.cpp
message TPropImgGruesome {
    option (NYT.default_field_flags) = SERIALIZATION_YT;

    optional double ApproxGl = 1 [(_compat_renamed_from) = "approx_gl"];
}

// TODO protobufize https://a.yandex-team.ru/arc/trunk/arcadia/search/web/rearrange/imgporno/imgporno.cpp
message TPropImgPorno {
    option (NYT.default_field_flags) = SERIALIZATION_YT;

    optional double ApproxCpl = 1 [(_compat_renamed_from) = "approx_cpl"];
    optional string ApproxPl = 2 [(_compat_renamed_from) = "approx_pl"];
    optional bool Cpl = 3 [(_compat_renamed_from) = "cpl"];
    optional bool Pl = 4 [(_compat_renamed_from) = "pl"];
    optional uint64 PornoThreshold = 5;
    optional string RestrictedSearchDetails = 6 [(_compat_renamed_from) = "restricted_search_details"];
}

// TODO protobufize https://a.yandex-team.ru/arc/trunk/arcadia/search/web/rearrange/imgqueryfactors/imgqueryfactors.cpp
message TPropImgQueryFactors {
    option (NYT.default_field_flags) = SERIALIZATION_YT;

    optional double GreenUrlCtr = 1;
    optional double QActuality = 2;
    optional double QCommercialProb = 3;
    optional double QCommercialProbV2 = 4;
    optional double QRefromulationProb = 5;
    optional double QWideness12vs3 = 6;
