// TODO protobufize https://a.yandex-team.ru/arc/trunk/arcadia/search/web/rearrange/imgsemidupsglueing/imgsemidupsglueing.cpp
message TPropImgSemidupsGlueing {
    option (NYT.default_field_flags) = SERIALIZATION_YT;

    optional string DuplicatesPairs = 1;
}

message TPropRoot {
    option (NYT.default_field_flags) = SERIALIZATION_YT;
    option (NYT.default_field_flags) = OPTIONAL_LIST;
