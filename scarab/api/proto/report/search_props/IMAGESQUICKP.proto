    optional double Acc = 1;
    map<string, string> AllFactorsUnanswer = 2 [(_compat_renamed_prefix) = "AllFactorsUnanswer_"];
    optional string BaseRankingMn = 3;
    optional string BaseRankingModel = 4;
    optional string BaseRankingWords = 5;
    optional bool BsTouched = 6;
    optional bool Cached = 7;
    optional uint64 CalcMetaRelevanceMcs = 8;
    map<uint64, uint64> ClientGroup = 9 [(_compat_renamed_prefix) = "ClientGroup_"];
    optional uint64 CommercialUnansweredCount = 10;
    map<string, string> ConfigInfo = 11 [(_compat_renamed_prefix) = "ConfigInfo_"];
    optional bool EnableCommercialFilter = 12;
    optional string ExtensionsRankModel = 13;
    optional string HostName = 14;
    optional uint64 Ig = 15;
    optional uint64 MetaRankDocs = 16;
    optional uint64 MetaRankGroups = 17;
    optional double MetaRankSuperMindMult = 18;
    optional uint64 Nctx = 19;
    map<string, NScarabProto.NCommon.TListOfDouble> NumDocs = 20 [(_compat_renamed_prefix) = "", (_compat_renamed_suffix) = "_numdocs"];
